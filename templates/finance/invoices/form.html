{% extends "base.html" %}{% block content %}<div class="kis-page"><div class="kis-page-header"><h1>Créer une facture</h1><p>{{ enrollment.student }} — {{ enrollment.classe }}</p></div><div class="kis-card"><div class="kis-card-body"><form method="post">{% csrf_token %}<div class="kis-form-group"><label>Type de frais</label><select name="fee_type" required><option value="">Sélectionner</option>{% for fee in fees %}<option value="{{ fee.id }}">{{ fee.name }} — {{ fee.amount|floatformat:"0" }} FCFA</option>{% endfor %}</select></div><button class="kis-btn kis-btn-primary">Créer la facture</button></form></div></div></div>{% endblock %}
