<form method="post" action="{{ action_url }}" data-modal-form data-modal-reload="true">{% csrf_token %}{% for f in form %}<div class="kis-form-group"><label class="kis-label">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}<div class="kis-modal-actions"><button type="button" class="kis-btn" data-modal-close>Annuler</button><button class="kis-btn kis-btn-primary" type="submit">Enregistrer</button></div></form>
