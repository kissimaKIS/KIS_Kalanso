<form method="post" action="{{ action_url }}" data-modal-form data-modal-reload="true">{% csrf_token %}{% if form.non_field_errors %}<div class="kis-alert kis-alert-danger">{{ form.non_field_errors }}</div>{% endif %}<div class="kis-form-grid kis-form-grid-2">{% for f in form %}<div class="kis-form-group"><label class="kis-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% if f.help_text %}<small class="text-muted">{{ f.help_text }}</small>{% endif %}{{ f.errors }}</div>{% endfor %}</div><div class="kis-modal-actions"><button type="button" class="kis-btn" data-modal-close>Annuler</button><button class="kis-btn kis-btn-primary" type="submit">Enregistrer</button></div></form>
