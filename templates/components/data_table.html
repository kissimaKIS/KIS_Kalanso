<div class="kis-card">

    <div class="kis-card-header d-flex justify-between align-center">

        <span>{{ title }}</span>

        <input
            type="text"
            class="kis-input"
            placeholder="Rechercher..."
            style="max-width:260px;">

    </div>

    <div class="kis-card-body">

        <div class="kis-table-wrapper">

            <table class="kis-table">

                <thead>

                    <tr>

                        <th>Élément</th>
                        <th>Date</th>
                        <th>Utilisateur</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td colspan="3" class="text-center">

                            Aucune donnée disponible.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
