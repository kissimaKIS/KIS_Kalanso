{% extends "base.html" %}{% block content %}<div class="kis-page"><div class="kis-page-header"><div><h1>Ajouter un élève</h1><p>Classe : {{ classe.name }}</p></div></div><div class="kis-card"><div class="kis-card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="kis-grid kis-grid-2">{% for f in form %}<div class="kis-form-group"><label>{{ f.label }}</label>{{ f }}{% for e in f.errors %}<small class="kis-text-danger">{{ e }}</small>{% endfor %}</div>{% endfor %}</div><button class="kis-btn kis-btn-primary">Enregistrer l'élève</button></form></div></div></div>{% endblock %}
