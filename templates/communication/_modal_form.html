<form method="post" action="{{ action_url }}" data-modal-form data-modal-reload="true">
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="kis-alert kis-alert-danger">{{ form.non_field_errors }}</div>{% endif %}
  {% for f in form %}<div class="kis-form-group"><label class="kis-label">{{ f.label }}</label>{{ f }}{% if f.help_text %}<small class="kis-form-help">{{ f.help_text }}</small>{% endif %}{{ f.errors }}</div>{% endfor %}
  <div class="kis-modal-actions"><button type="button" class="kis-btn" data-modal-close>Annuler</button><button class="kis-btn kis-btn-primary" type="submit">Publier</button></div>
</form>
