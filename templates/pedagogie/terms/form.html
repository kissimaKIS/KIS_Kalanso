{% extends "base.html" %}{% block content %}<div class="kis-page"><div class="kis-page-header"><h1>Nouvelle période</h1><p>{{ school_year.name }}</p></div><div class="kis-card"><div class="kis-card-body">{% if errors %}<div class="kis-form-errors">{% for error in errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}<form method="post">{% csrf_token %}<div class="kis-form-group"><label>Nom de la période</label><input name="name" value="{{ name }}" placeholder="Période 1" maxlength="50" required></div><div class="kis-form-group"><label>Ordre</label><input type="number" name="order" value="{{ order|default:1 }}" min="1" required></div><button class="kis-btn kis-btn-primary">Créer la période</button></form></div></div></div>{% endblock %}
