{% extends "base.html" %}{% block content %}<div class="kis-page"><h1>Ajouter un document</h1><form data-document-form data-students-url="{% url 'document_students' 0 %}" method="post" enctype="multipart/form-data" class="kis-card"><div class="kis-card-body">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{% if student_pieces %}<datalist id="document-pieces">{% for p in student_pieces %}<option value="{{ p }}">{% endfor %}</datalist>{% endif %}<div class="kis-form-group"><label class="kis-label">{{ form.title.label }}</label>{{ form.title }}</div><div class="kis-form-group"><label class="kis-label">{{ form.category.label }}</label>{{ form.category }}</div><div class="kis-form-grid kis-form-grid-2"><div class="kis-form-group"><label class="kis-label" id="document-classe-label">Classe</label>{{ form.classe }}</div><div class="kis-form-group"><label class="kis-label" id="document-student-label">Élève</label>{{ form.student }}</div></div><div class="kis-form-group"><label class="kis-label">Fichier</label>{{ form.file }}</div><button class="kis-btn kis-btn-primary">Enregistrer</button></div></form></div>{% endblock %}
